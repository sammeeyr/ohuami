{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In — {{ brand_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-200 shadow-md space-y-5">
    <div class="text-center space-y-1">
      <img src="{% static 'images/logo.svg' %}" alt="{{ brand_name }}" class="h-8 mx-auto mb-2">
      <h1 class="text-xl font-black text-[#111111]">Welcome Back</h1>
      <p class="text-xs text-gray-500">Sign in to manage your orders and profile</p>
    </div>

    {% if error %}
      <div class="p-3 bg-red-50 border border-red-200 text-[#E53935] text-xs font-semibold rounded-xl">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'accounts:login' %}" class="space-y-4 text-xs">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}">

      <div>
        <label class="block font-bold text-gray-700 mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="you@example.com"
               class="w-full px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:border-[#E53935] font-semibold">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="font-bold text-gray-700">Password</label>
        </div>
        <input type="password" name="password" required placeholder="••••••••"
               class="w-full px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:border-[#E53935] font-semibold">
      </div>

      <button type="submit" class="w-full btn-primary py-3 rounded-full text-xs font-black shadow-md mt-2">
        Sign In to Account
      </button>
    </form>

    <div class="pt-4 border-t border-gray-100 text-center text-xs text-gray-500">
      Don't have an account yet? 
      <a href="{% url 'accounts:register' %}" class="font-extrabold text-[#E53935] hover:underline">
        Create one now
      </a>
    </div>
  </div>
</div>
{% endblock %}
