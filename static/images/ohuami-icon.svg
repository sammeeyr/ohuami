<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="awningRed1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF5350" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="awningRed2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="yellowCurve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFC928" />
    </linearGradient>
  </defs>

  <!-- Market Awning (Top 4 Red Scallops) -->
  <g id="market-awning">
    <!-- Scallop 1 (Leftmost) -->
    <path d="M 28 58 C 30 40 40 32 48 30 L 52 56 C 52 61 46 64 40 64 C 33 64 28 61 28 58 Z" fill="url(#awningRed2)" />
    <!-- Scallop 2 (Center-Left) -->
    <path d="M 50 30 C 58 28 66 28 72 28 L 74 58 C 74 64 68 66 62 66 C 56 66 51 63 50 58 Z" fill="url(#awningRed1)" />
    <!-- Scallop 3 (Center-Right) -->
    <path d="M 74 28 C 82 28 92 29 98 32 L 96 58 C 96 64 90 66 84 66 C 78 66 74 63 74 58 Z" fill="url(#awningRed2)" />
    <!-- Scallop 4 (Rightmost) -->
    <path d="M 100 32 C 108 34 118 42 120 58 C 120 62 115 64 108 64 C 102 64 98 60 97 56 Z" fill="url(#awningRed1)" />
    <!-- Top Canopy Smooth Curve -->
    <path d="M 30 54 C 40 32 70 24 118 54 C 114 30 76 22 30 54 Z" fill="#FF8A80" opacity="0.3" />
  </g>

  <!-- Yellow Market Crescent Curve (Bottom) -->
  <path d="M 28 76 C 28 108 52 130 84 130 C 110 130 126 112 126 96 C 126 92 120 90 114 93 C 110 106 98 116 84 116 C 60 116 42 98 42 76 C 42 70 36 68 31 71 C 29 72 28 74 28 76 Z" 
        fill="url(#yellowCurve)" />

  <!-- Connected Commerce Digital Market Nodes (4 Dots & Links) -->
  <g id="connected-nodes" fill="#111111" stroke="#111111">
    <!-- Connecting lines -->
    <line x1="114" y1="94" x2="128" y2="86" stroke-width="3" stroke-linecap="round" />
    <line x1="124" y1="98" x2="140" y2="94" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="108" x2="134" y2="114" stroke-width="3" stroke-linecap="round" />

    <!-- 4 Nodes -->
    <circle cx="128" cy="86" r="6" stroke-width="0" />
    <circle cx="140" cy="94" r="5" stroke-width="0" />
    <circle cx="134" cy="114" r="5.5" stroke-width="0" />
    <circle cx="118" cy="106" r="4.5" stroke-width="0" />
  </g>
</svg>
