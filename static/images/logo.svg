<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFC928" />
    </linearGradient>
  </defs>
  
  <!-- Isometric 3D Cube Icon -->
  <g transform="translate(4, 3)">
    <!-- Top Face (Yellow accent) -->
    <polygon points="22,4 38,12 22,20 6,12" fill="url(#yellowAccent)" />
    <!-- Left Face (Dark / Slate) -->
    <polygon points="6,12 22,20 22,38 6,30" fill="#111111" />
    <!-- Right Face (Primary Cube Tech Red) -->
    <polygon points="22,20 38,12 38,30 22,38" fill="url(#cubeGradient)" />
    <!-- Inner Accent Cube Core Point -->
    <circle cx="22" cy="20" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: CUBE TECH ENTERPRISES -->
  <text x="52" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" fill="#111111" letter-spacing="-0.5">
    CUBE<tspan fill="#E53935">TECH</tspan>
  </text>
  <text x="52" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#6B7280" letter-spacing="2.2">
    ENTERPRISES
  </text>
</svg>
